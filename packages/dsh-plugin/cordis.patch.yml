# The dsh-memlens bundle layer. The manifest points to this file with
# package.json#dsh.bundle.patch.
#
# The layer is a YAML array of row verbs. `insert` adds one plugin row to the
# composed configuration.
#
# `id` is the row identifier. A later layer uses the id to override this row.
# `name` is the module specifier that the loader imports. It must resolve to
# this package entry.
#
# The host row loads for each session. An agent preset mounts the second entry
# point, `@memlens/dsh-plugin/preset`. The key `profile` is optional: an absent
# key selects the default profile of the base file.
- insert:
    - id: memlens
      name: "@memlens/dsh-plugin"
