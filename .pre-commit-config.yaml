# Hooks for prek. Run `prek install` after a clone.
# prek reads this file in the pre-commit config format.
default_install_hook_types: [pre-commit, pre-push]

repos:
  - repo: local
    hooks:
      - id: biome
        name: biome check
        # The binary comes from the root dev dependency, so the version is in the lockfile.
        # Check only. A write conflicts with the stash that prek keeps for unstaged files.
        entry: pnpm exec biome check --no-errors-on-unmatched
        language: system
        types_or: [ts, tsx, json]

      - id: regions
        name: region layout
        entry: node scripts/check-regions.mjs
        language: system
        types_or: [ts, tsx]

      - id: ste-lint
        name: ste lint
        entry: pnpm run lint:docs
        language: system
        files: \.(md|html)$
        pass_filenames: false

      - id: arch-export
        name: architecture export
        entry: sh -c 'pnpm run arch:export && git diff --exit-code docs/arch/README.md'
        language: system
        files: ^docs/arch/
        pass_filenames: false

      - id: typecheck
        name: typecheck
        entry: pnpm run typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: test
        name: test
        entry: pnpm run test
        language: system
        pass_filenames: false
        stages: [pre-push]
