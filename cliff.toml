# Release notes of one version. The workflow `CI` gives the output to `gh release create`.
# https://git-cliff.org/docs/configuration

[changelog]
# The title of the release holds the version, so the notes hold the groups of the commits only.
body = """
{%- for group, commits in commits | group_by(attribute="group") %}
### {{ group }}

{% for commit in commits -%}
- {% if commit.scope %}*({{ commit.scope }})* {% endif %}{{ commit.message | split(pat="\n") | first | trim | upper_first }}
{% endfor %}
{%- endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Fixes" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^docs", group = "Documentation" },
  { message = "^spec", group = "Specification" },
  { message = "^test", group = "Tests" },
  { message = "^build", group = "Build" },
  { message = "^chore", skip = true },
]
